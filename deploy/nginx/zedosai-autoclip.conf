# AutoClip private UI — basic auth; Redis/Flower stay off the public internet.
# Installed on zedosai.com as /etc/nginx/snippets/zedosai-autoclip.conf (included by the server block).
location = /autoclip {
    return 301 /autoclip/;
}

# --- Social publisher public carve-outs (NO basic auth) ---------------------------------
# OAuth providers redirect the user's browser here. The backend only accepts a callback whose
# single-use `state` was minted by an authenticated /oauth/{platform}/start call in the last 15 min.
location ~ ^/autoclip/api/v1/social/oauth/(tiktok|instagram|youtube)/callback$ {
    limit_except GET { deny all; }
    rewrite ^/autoclip/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8030;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
}
# Instagram's servers fetch the Reel from here. Each URL carries an HMAC signature + expiry and only
# resolves while its publish job is in flight.
location ~ ^/autoclip/api/v1/social/media/[A-Za-z0-9-]+\.mp4$ {
    limit_except GET { deny all; }
    rewrite ^/autoclip/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8030;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_read_timeout 600s;
    proxy_buffering off;
}

location /autoclip/api/ {
    auth_basic "AutoClip";
    auth_basic_user_file /etc/nginx/.htpasswd-autoclip;
    proxy_pass http://127.0.0.1:8030/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization "";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 2g;
    proxy_buffering off;
}

location /autoclip/docs {
    auth_basic "AutoClip";
    auth_basic_user_file /etc/nginx/.htpasswd-autoclip;
    proxy_pass http://127.0.0.1:8030/docs;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
}
location /autoclip/openapi.json {
    auth_basic "AutoClip";
    auth_basic_user_file /etc/nginx/.htpasswd-autoclip;
    proxy_pass http://127.0.0.1:8030/openapi.json;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
}
location /autoclip/redoc {
    auth_basic "AutoClip";
    auth_basic_user_file /etc/nginx/.htpasswd-autoclip;
    proxy_pass http://127.0.0.1:8030/redoc;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
}

location /autoclip/ {
    auth_basic "AutoClip";
    auth_basic_user_file /etc/nginx/.htpasswd-autoclip;
    proxy_pass http://127.0.0.1:3030/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
}
